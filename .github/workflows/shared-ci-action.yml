on:
  workflow_call:
    inputs:
      isScheduled:
        description: Whether this CI workflow run is scheduled
        type: boolean
        required: false
        default: false

jobs:
  detect:
    name: Detect toolchain
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.detect.outputs.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect toolchain
        id: detect
        run: |
          if [[ -f mise.toml || -f mise/config.toml ]]; then
            echo "runner=mise" >> "$GITHUB_OUTPUT"
          else
            echo "runner=make" >> "$GITHUB_OUTPUT"
          fi

  make:
    name: Make
    needs: detect
    if: needs.detect.outputs.runner == 'make'
    uses: $/.github/workflows/shared-ci-action-make.yml
    with:
      isScheduled: ${{ inputs.isScheduled }}
    secrets: inherit

  mise:
    name: Mise
    needs: detect
    if: needs.detect.outputs.runner == 'mise'
    uses: $/.github/workflows/shared-ci-action-mise.yml
    with:
      isScheduled: ${{ inputs.isScheduled }}
    secrets: inherit
